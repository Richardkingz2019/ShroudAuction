[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/contracts/auction/keys/*"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/contracts/auction/zkir/*"
  [headers.values]
    Content-Type = "application/octet-stream"
